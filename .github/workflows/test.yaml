name: CI/CD - Sistema CRUD PHP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create environment file
        run: |
          echo "Creating .env file for CI"
          cat > Backend/.env << EOF
          DB_HOST=db
          DB_PORT=3306
          DB_NAME=productos_db
          DB_USER=user
          DB_PASS=password
          DB_TEST_HOST=db_test
          DB_TEST_PORT=3306
          DB_TEST_NAME=productos_test_db
          DB_TEST_USER=test_user
          DB_TEST_PASS=test_password
          EOF

      - name: Build and start services
        run: |
          echo "Building containers..."
          docker compose build
          echo "Starting services..."
          docker compose up -d
          echo "Waiting for services to be healthy..."

      - name: Wait for MySQL services to be healthy
        run: |
          echo "Waiting for databases to be ready..."
          sleep 30  # Give initial time for containers to start

          # Check if containers are running
          docker compose ps

          # Wait for test database
          for i in {1..20}; do
            if docker compose exec db_test mysql -utest_user -ptest_password -e "SELECT 1;" >/dev/null 2>&1; then
              echo "Test database is ready!"
              break
            fi
            echo "Waiting for test database... ($i/20)"
            sleep 10
          done

      - name: Install dependencies and run tests
        run: |
          echo "Installing Composer dependencies..."
          docker compose exec backend composer install --no-interaction --prefer-dist

          echo "Updating composer lock file if needed..."
          docker compose exec backend composer update --lock

          echo "Verifying PHPUnit installation..."
          docker compose exec backend ls -la vendor/bin/phpunit
          docker compose exec backend ./vendor/bin/phpunit --version
      - name: Run unit tests
        run: |
          echo "Running PHPUnit tests..."
          docker compose exec backend ./vendor/bin/phpunit --testdox --log-junit coverage/junit.xml

          echo "Unit tests completed successfully!"
      - name: Test API endpoints
        run: |
            echo "Testing API endpoints..."
            sleep 10  # Wait for backend to be fully ready

            # Test GET /api/products
            echo "Testing GET /api/products..."
            curl -f "http://localhost:8000/api/products" | head -c 500
            echo -e "\n✅ GET test completed"

            # Test POST /api/products with correct field mapping
            echo "Testing POST /api/products..."
            curl -X POST -H "Content-Type: application/json" \
                -d '{"name":"Test Product","description":"Test Description","price":99.99,"stock":10}' \
                "http://localhost:8000/api/products"
            echo -e "\n✅ POST test completed"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            Backend/coverage/junit.xml
            Backend/phpunit.xml
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v