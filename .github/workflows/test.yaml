name: CI - PHP with Docker & MySQL

on:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get install docker-compose -y

      - name: Build docker containers
        run: docker compose build

      - name: Start docker services
        run: docker compose up -d

      - name: Wait for MySQL to be ready
        run: |
          echo "Esperando MySQL..."
          for i in {1..20}; do
            if docker exec $(docker ps -qf "name=mysql") mysql -uroot -proot -e "SELECT 1;" > /dev/null 2>&1; then
              echo "MySQL listo!"
              break
            fi
            echo "Esperando..."
            sleep 3
          done

      - name: Run PHPUnit tests inside backend container
        run: docker compose exec backend vendor/bin/phpunit --testdox